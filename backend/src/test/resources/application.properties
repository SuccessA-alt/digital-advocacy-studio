# Tests use a temporary database stored only in memory.
spring.datasource.url=jdbc:h2:mem:advocacy_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
# Build fresh test tables and remove them when the tests finish.
spring.jpa.hibernate.ddl-auto=create-drop